# Homelander autoapply configuration — copy to config/autoapply.config.yaml and fill in your values.
#
# This file IS committed (no secrets). Your config/autoapply.config.yaml is gitignored.
# Message template goes in config/message.txt.

fredy:
  base_url: "http://<your-fredy-server>:9998"   # your Fredy instance
  username: "admin"
  password: "admin"                       # change after first Fredy login
  job_id: ""                              # Fredy job ID for your IS24 search

chrome:
  cdp_url: "http://localhost:9222"        # host Chrome CDP endpoint

polling:
  interval_seconds: 60
  max_sends_per_run: 15                   # safety cap per run; 0 = no limit

speed: "balanced"                          # "fast", "balanced", or "slow"

# ── Timing overrides (optional) ──────────────────────────────────────
# Override individual timers from the speed preset. Omit or comment out
# to keep the preset default. Values are in milliseconds.
# Array pairs are [min, max] — actual delay is random within the range.
timing:
  # preSendJitter:     [2000, 8000]      # wait before navigating to listing
  # spaRenderWait:     [3000, 6000]      # wait for React SPA to hydrate
  # formWaitTimeout:   7000              # max wait for contact form to appear
  # anredeJitter:      [1000, 1500]      # after salutation select
  # fieldJitter:       [1000, 1500]      # between input fields
  # textareaJitter:    [1000, 1500]      # after clearing textarea
  # typeDelay:         [100, 150]        # per-character keyboard delay
  # postTypeJitter:    [1000, 1500]      # after typing message
  # cooldown:          [5000, 15000]     # between listings

captcha:
  api_key: ""                             # 2captcha API key (optional)

contact:
  anrede: "Frau"
  vorname: "Vorname"
  nachname: "Nachname"
  email: "email@example.com"
  telefon: ""
  strasse: "Strassenname"
  hausnummer: "00"
  plz: "00000"
  ort: "Stadt"

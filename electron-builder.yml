# electron-builder configuration for Homelander
appId: com.homelander.app
productName: Homelander
copyright: Copyright © 2026
npmRebuild: false

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - electron/**/*
  - src/**/*
  - engine/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: engine
    to: engine
  - from: chrome-bundled
    to: chrome-bin

mac:
  category: public.app-category.productivity
  # Arch is set by the CLI (--arm64 / --x64), never listed here. With
  # npmRebuild:false, listing both arches would pack the build host's native
  # modules into every arch's bundle — that shipped an arm64 better_sqlite3.node
  # inside the x64 app in v1.5.0. CI builds each arch on its own native runner.
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - deb
    - AppImage
  category: Utility
  icon: resources/icon.png

publish:
  provider: github
  owner: B1Z0N
  repo: homelander

# electron-builder configuration for Homelander
appId: com.homelander.app
productName: Homelander
copyright: Copyright © 2026
npmRebuild: true

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - electron/**/*
  - src/**/*
  - engine/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: engine
    to: engine
  - from: chrome-bundled
    to: chrome-bin

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon.icns
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - deb
    - AppImage
  category: Utility
  icon: resources/icon.png

publish:
  provider: github
  owner: B1Z0N
  repo: homelander

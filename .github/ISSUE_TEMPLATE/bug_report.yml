name: Bug Report
description: Something isn't working
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! Please fill out as much as you can."
  - type: input
    id: version
    attributes:
      label: Homelander version
      placeholder: "1.3.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste daemon logs or app screenshots. Do NOT share config.json or API keys.
